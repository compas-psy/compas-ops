# Core-сервисы HELM (ТЗ §4.2).
#
# Версии образов пинуются (§33 «pin versions/images»): плавающий :latest
# означает, что перезапуск контейнера в три часа ночи может принести другую
# мажорную версию Postgres.
#
# Ни один порт не публикуется наружу. Публичный периметр — только Caddy
# (§4.6): Postgres, LiteLLM, Hermes и админ-API Control Plane не выставляются.

name: helm

x-logging: &logging
  # §25.6: ограниченные логи. Без этого journald и json-file съедают диск
  # быстрее, чем растут данные.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    <<: *restart
    logging: *logging
    environment:
      POSTGRES_USER: helm
      POSTGRES_DB: helm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Локаль фиксируется: сортировка влияет на индексы, и её смена между
      # версиями образа ломает уникальные индексы молча.
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    # Только на loopback (§4.6).
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helm -d helm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 256mb
    deploy:
      resources:
        limits:
          # 12 ГБ на всё (§4.1), и апгрейд запрещён до метрик. Postgres —
          # самый прожорливый сосед, поэтому его потолок задан явно.
          memory: 3g

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.55.8
    <<: *restart
    logging: *logging
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      STORE_MODEL_IN_DB: "True"
      # НАЙДЕНО НА P3 bring-up: OpenRouter блокирует IP этого VPS
      # (cloudflare 403 "Access denied by security policy" ещё до
      # авторизации — датацентровый диапазон, не Россия целиком: с обычной
      # машины тот же запрос отдаёт 200). Обход — только для трафика к
      # OpenRouter, через sing-box+mieru туннель в Финляндию
      # (systemd unit sing-box@openrouter-proxy, локальный inbound
      # 127.0.0.1:18080). NO_PROXY защищает собственный healthcheck
      # контейнера, который бьёт в самого себя по HTTP.
      HTTPS_PROXY: http://127.0.0.1:18080
      HTTP_PROXY: http://127.0.0.1:18080
      NO_PROXY: 127.0.0.1,localhost
    # НАЙДЕНО НА P3 bring-up: контейнер работает от root (проверено —
    # group_add, в отличие от helm-core, не нужен), но образ litellm НЕ
    # реализует конвенцию _FILE сам (в отличие от официального Postgres):
    # переменные вида OPENROUTER_API_KEY_FILE молча игнорируются, litellm
    # ищет OPENROUTER_API_KEY/DATABASE_URL/LITELLM_MASTER_KEY как есть.
    # Контейнер стартовал и прошёл healthcheck без них — баг был не виден,
    # пока не пришёл первый реальный completion-запрос (модели грузятся из
    # config.yaml независимо от БД; без LITELLM_MASTER_KEY прокси, похоже,
    # просто не проверяет авторизацию). Тот же класс проблемы, что уже
    # решался для helm-core (helm_core/config.py), только не в своём коде —
    # entrypoint-обёртка читает секреты сама и экспортирует их под именами,
    # которые litellm реально ищет.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - export OPENROUTER_API_KEY=$(cat /run/secrets/openrouter_api_key) DATABASE_URL=$(cat /run/secrets/litellm_database_url) LITELLM_MASTER_KEY=$(cat /run/secrets/litellm_master_key); exec litellm --config /app/config.yaml --port 4000
    secrets: [litellm_master_key, litellm_database_url, openrouter_api_key]
    volumes:
      - ../config/models/litellm.yaml:/app/config.yaml:ro
    # host, не bridge: HTTPS_PROXY=127.0.0.1:18080 выше — это loopback
    # ХОСТА, где слушает sing-box (см. network_mode: host у caddy —
    # та же причина). Из-за этого секрет litellm_database_url обязан
    # указывать на 127.0.0.1, не на service-имя postgres — Docker DNS
    # недоступен без bridge-сети.
    network_mode: host
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits: {memory: 1g}

  helm-core:
    build:
      context: ../control-plane
      dockerfile: Dockerfile
    image: helm-core:0.1.0
    <<: *restart
    logging: *logging
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      HELM_DATABASE_URL_FILE: /run/secrets/helm_database_url
      HELM_POLICY_PATH: /opt/helm/config/policies/actions.yaml
      HELM_OWNER_ID_FILE: /run/secrets/telegram_owner_id
      # id владельца в MAX — другое число, чем Telegram-id (§10.1 п.2):
      # по нему вебхук отличает владельца, а задача заводится под
      # канонической identity из HELM_OWNER_ID_FILE.
      HELM_MAX_OWNER_ID_FILE: /run/secrets/max_owner_id
      HELM_PANEL_RP_ID: helm.cmpas.ru
      HELM_PANEL_ORIGIN: https://helm.cmpas.ru
      TZ: Europe/Moscow
    secrets: [helm_database_url, telegram_owner_id, hermes_service_hmac,
              panel_auth_cookie_secret, telegram_bot_token,
              max_webhook_secret, max_bot_token, max_owner_id]
    # docker compose (не swarm) монтирует secrets bind-mount'ом с теми же
    # правами, что и на хосте (0600 root:root, §6.3) — не сбрасывает их на
    # 0444, как это делал бы Swarm. Контейнер работает под UID 10001, не
    # root (Dockerfile), поэтому без group_add чтение секрета падает
    # PermissionError. GID числом, не именем: имя группы живёт только в
    # /etc/group хоста и не резолвится через границу bind-mount.
    group_add: ["10001"]
    volumes:
      - ../config:/opt/helm/config:ro
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    deploy:
      resources:
        limits: {memory: 768m}

  n8n:
    image: n8nio/n8n:2.36.8
    <<: *restart
    logging: *logging
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n_database_password
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      GENERIC_TIMEZONE: Europe/Moscow
      TZ: Europe/Moscow
      # §17.1: Community edition, queue mode не включаем (EXECUTIONS_MODE не
      # задан → regular, без Redis — "no Redis unless factual need appears").
      # §17.4: редактор остаётся localhost/SSH-туннель, наружу через Caddy
      # не идёт вообще — ни один OAuth callback пока не заведён (P6 start
      # set его не требует), поэтому WEBHOOK_URL смотрит на loopback.
      #
      # N8N_HOST=0.0.0.0, не 127.0.0.1: это внутренний интерфейс КОНТЕЙНЕРА,
      # не хоста — та же ошибка, что уже была у helm-core на P2 bring-up
      # (Dockerfile CMD, "--host 0.0.0.0"). Хелсчек внутри контейнера видел
      # 127.0.0.1 живым, а проброс порта ports: ["127.0.0.1:5678:5678"]
      # приходит через сетевой интерфейс контейнера, не через его loopback —
      # снаружи ERR_EMPTY_RESPONSE при зелёном healthcheck. Внешняя
      # доступность по-прежнему только 127.0.0.1 ХОСТА — это делает ports:.
      N8N_HOST: 0.0.0.0
      N8N_PROTOCOL: http
      N8N_PORT: "5678"
      # N8N_WEBHOOK_URL, не устаревший WEBHOOK_URL (лог сам на это указал).
      N8N_WEBHOOK_URL: http://127.0.0.1:5678/
    secrets: [n8n_database_password, n8n_encryption_key]
    # Тот же класс проблемы, что уже решён для helm-core: секреты — root:
    # helm-secrets 640, образ n8n работает под непривилегированным node
    # (не root), без членства в группе — EACCES на /run/secrets/*.
    # GID числом, не именем (см. helm-core выше — имя группы не резолвится
    # через границу bind-mount).
    group_add: ["10001"]
    volumes:
      - n8n_data:/home/node/.n8n
    # §4.6 / test_perimeter.py::NEVER_PUBLIC_PORTS: 5678 никогда не публичный
    # — только 127.0.0.1, доступ владельца через ssh -L 5678:127.0.0.1:5678.
    ports: ["127.0.0.1:5678:5678"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # НАЙДЕНО на живом деплое: 512m было мало — "FATAL ERROR:
          # JavaScript heap out of memory" при старте (V8/n8n тяжелее,
          # чем control-plane на Python). n8n сам рекомендует ~1 ГБ+.
          memory: 1g

  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.3
    <<: *restart
    logging: *logging
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD__FILE: /run/secrets/forgejo_database_password
      FORGEJO__server__DOMAIN: git.cmpas.ru
      FORGEJO__server__ROOT_URL: https://git.cmpas.ru/
      FORGEJO__server__HTTP_PORT: "3000"
      # §18.1 "git.cmpas.ru private by default": ни анонимного чтения, ни
      # самостоятельной регистрации — единственный владелец заводится вручную
      # один раз (forgejo admin user create) после первого подъёма.
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__repository__DEFAULT_PRIVATE: private
      # Пропускает веб-инсталлятор (небезопасен для контейнера без сохранения
      # состояния установки между рестартами) — конфигурация целиком через
      # переменные окружения, как и было задумано с самого начала.
      FORGEJO__security__INSTALL_LOCK: "true"
      TZ: Europe/Moscow
    secrets: [forgejo_database_password]
    volumes:
      - forgejo_data:/data
    # SSH-клонирование не заводим (§18.1: "отдельный public Forgejo SSH порт
    # не обязателен" — HTTPS-токена достаточно) — порт 22 не публикуется и
    # не пробрасывается вовсе, меньше поверхность внимания на порт наружу.
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits: {memory: 512m}

  caddy:
    image: caddy:2.8-alpine
    <<: *restart
    logging: *logging
    depends_on:
      helm-core: {condition: service_healthy}
    # host, не bridge: Caddyfile проксирует на 127.0.0.1:PORT для каждого
    # внутреннего сервиса — тот же loopback хоста, на который они публикуются
    # (§4.6, "ни один порт не публикуется наружу"). В bridge-сети у Caddy
    # был бы собственный loopback, не хоста, и reverse_proxy получал бы
    # connection refused ко всем внутренним сервисам. Публично это ничего не
    # меняет: Caddy и так единственный сервис с публичными портами, host
    # networking просто даёт ему тот же loopback, что у остальных.
    network_mode: host
    volumes:
      - ../config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../panel/dist:/srv/panel:ro
      - /var/lib/helm-guardian/public-status.json:/srv/guardian/status.json:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits: {memory: 256m}

secrets:
  postgres_password:    {file: /etc/helm/secrets/postgres_password}
  litellm_master_key:   {file: /etc/helm/secrets/litellm_master_key}
  litellm_database_url: {file: /etc/helm/secrets/litellm_database_url}
  openrouter_api_key:   {file: /etc/helm/secrets/openrouter_api_key}
  helm_database_url:    {file: /etc/helm/secrets/helm_database_url}
  telegram_owner_id:    {file: /etc/helm/secrets/telegram_owner_id}
  hermes_service_hmac:  {file: /etc/helm/secrets/hermes_service_hmac}
  panel_auth_cookie_secret:    {file: /etc/helm/secrets/panel_auth_cookie_secret}
  telegram_bot_token:          {file: /etc/helm/secrets/telegram_bot_token}
  n8n_database_password:       {file: /etc/helm/secrets/n8n_database_password}
  n8n_encryption_key:          {file: /etc/helm/secrets/n8n_encryption_key}
  forgejo_database_password:   {file: /etc/helm/secrets/forgejo_database_password}
  max_webhook_secret:          {file: /etc/helm/secrets/max_webhook_secret}
  max_bot_token:               {file: /etc/helm/secrets/max_bot_token}
  max_owner_id:                {file: /etc/helm/secrets/max_owner_id}

volumes:
  pgdata:       {name: helm_pgdata}
  caddy_data:   {name: helm_caddy_data}
  caddy_config: {name: helm_caddy_config}
  n8n_data:     {name: helm_n8n_data}
  forgejo_data: {name: helm_forgejo_data}
