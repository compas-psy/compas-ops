name: Ночной цикл

# Ежедневно в 02:00 UTC = 05:00 МСК.
# Секреты: CLAUDE_CODE_OAUTH_TOKEN, TG_BOT_TOKEN, TG_CHAT_ID.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.runner/daily'

permissions:
  contents: write
  id-token: write

concurrency:
  group: rhythm
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Браузер для сборки PDF
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Конвертер документов
        run: pip install --quiet 'markitdown[all]' || echo "markitdown не установился, продолжаем без него"

      - name: Ночной цикл
        uses: anthropics/claude-code-action@v1
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Ты запущен как ночной цикл операционной системы СИМПАС в репозитории compas-ops.
            Читай по порядку: CLAUDE.md, charter/00_ORG_CHARTER.md, charter/08_SCHEDULES.md.
            Выполни протокол ночного цикла из charter/08_SCHEDULES.md §1 целиком и без сокращений.
            Промпт ритма живёт в этом документе — он единственный источник правды, здесь он не дублируется.

            Три поправки к тексту протокола, они сильнее его:
            1. Репозиторий уже склонирован и ты в нём — ШАГ 0 считай выполненным.
            2. Доставку ШАГА 7 выполняй прямо здесь: Telegram с этого раннера доступен,
               токен и чат уже в переменных окружения, команда tools/deliver.py работает как есть.
               Обходных каналов не ищи: не удалось — действуй по charter/06_DELIVERY §7.
            3. ШАГ 8 «ветка и pull request» не выполняй: коммит в main делает следующий шаг воркфлоу.

            Результат обязан быть записан в файлы репозитория до завершения работы.

      - name: Зафиксировать результат
        run: |
          git config user.name  "simpas-night"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Ночной цикл не изменил ни одного файла — считаем прогон неуспешным"
            exit 1
          fi
          git commit -m "Ночной цикл $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Проверить, что сводка существует
        run: |
          today=$(date -u +%Y-%m-%d)
          if [ ! -f "outbox/${today}_daily.txt" ]; then
            echo "::error::Нет outbox/${today}_daily.txt — цикл отработал, но сводка учредителю не написана"
            exit 1
          fi
          echo "Сводка на месте: outbox/${today}_daily.txt"
