name: Выкат на сервер

# Единственный способ, которым агент может работать на живом сервере, не
# получая приватного ключа: ключ лежит в GitHub Secrets, агент запускает
# workflow и читает логи, но самого ключа не видит никогда (устав §6,
# CLAUDE.md §5.4 — «секреты живут только в GitHub Secrets»).
#
# Секреты, которые нужно завести один раз:
#   VPS_SSH_KEY      приватный ключ ОТДЕЛЬНОЙ пары для CI (не тот, что на
#                    машине владельца — чтобы отзывался независимо)
#   VPS_KNOWN_HOSTS  вывод `ssh-keyscan -H 185.250.44.137`; без него
#                    пришлось бы отключить проверку хоста, а это ровно та
#                    дыра, ради которой существует known_hosts
#
# По умолчанию действие — `verify`, то есть только чтение. Выкатить
# что-либо можно лишь явно выбрав действие: случайный запуск ничего не
# меняет.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Что сделать'
        required: true
        default: verify
        type: choice
        options:
          - keyscan       # напечатать ключи сервера для VPS_KNOWN_HOSTS
          - verify        # только посмотреть состояние, ничего не менять
          - cleanup       # убрать мусор прошлых выкатов
          - backup-unlock # снять зависшую блокировку репозитория бэкапов
          - backup        # снять точку возврата
          - deploy        # код + панель + пересборка контейнеров
          - migrate       # alembic upgrade head (после deploy)
          - restore-test  # backup.sh + restore_test.sh
          - rollback      # alembic downgrade до указанной ревизии
      code_ref:
        description: 'Ветка с кодом для выката'
        required: false
        default: main
      revision:
        description: 'Ревизия для rollback (например 03af17f40250)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Отдельная от `rhythm` группа: ночной цикл и выкат не должны стоять в
  # одной очереди, но два выката одновременно — недопустимы.
  group: deploy
  cancel-in-progress: false

env:
  VPS_HOST: 185.250.44.137
  VPS_USER: helm

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Логика workflow берётся из main (иначе его нечем запустить), а КОД
      # для выката — из указанной ветки. Без этого разделения выкат
      # поставил бы на сервер содержимое main, даже когда работа лежит на
      # рабочей ветке: поймано отменённым запуском 30.08.2026.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref }}

      - name: Что именно выкатывается
        run: |
          echo "ветка: ${{ inputs.code_ref }}"
          echo "коммит: $(git rev-parse HEAD)"
          git log -1 --pretty=%s

      # keyscan работает БЕЗ секретов: это первый шаг настройки, когда
      # VPS_KNOWN_HOSTS ещё неоткуда взять. Нужен потому, что ssh-keyscan
      # на Windows у владельца старый и не договаривается с OpenSSH 9.6
      # на сервере; здесь свежий.
      - name: Ключи сервера для VPS_KNOWN_HOSTS
        if: inputs.action == 'keyscan'
        run: |
          echo "Скопируйте строки ниже целиком в секрет VPS_KNOWN_HOSTS:"
          echo "---"
          ssh-keyscan "$VPS_HOST"
          echo "---"

      - name: Ключ доступа
        if: inputs.action != 'keyscan'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::Не заведены секреты VPS_SSH_KEY и/или VPS_KNOWN_HOSTS"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # ── verify: только чтение ────────────────────────────────────────
      - name: Состояние сервера
        if: inputs.action == 'verify'
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" '
            set -e
            echo "=== контейнеры ==="
            cd /opt/helm/compose && sudo docker compose ps
            echo "=== ревизия схемы ==="
            sudo docker compose exec -T helm-core python3 -m alembic current
            echo "=== роли базы: rolsuper и rolbypassrls обязаны быть f у роли приложения ==="
            # Ни одного строкового литерала в запросе — намеренно. Команда
            # проходит через две оболочки (bash раннера → bash сервера):
            # апостроф там не выживает, а $$ сервер разворачивает в номер
            # своего процесса. Оба варианта уже сломались на живых запусках.
            # rolbypassrls важен не меньше rolsuper: роль с этим правом тоже
            # обходит изоляцию между пользователями, только тише.
            sudo docker exec helm-postgres-1 psql -U helm -d helm -c \
              "select rolname, rolsuper, rolbypassrls from pg_roles where rolcanlogin order by rolname"
            echo "=== объём знаний ==="
            sudo docker exec helm-postgres-1 psql -U helm -d helm -tAc \
              "select count(*) as sources from knowledge_sources" || echo "таблиц ещё нет"
            echo "=== место и память ==="
            df -h / | tail -1; free -h | head -2
            echo "=== последний бэкап ==="
            stat -c %y /var/lib/helm-guardian/last-backup 2>/dev/null || echo "нет отметки"
          '

      # ── backup: точка возврата перед всем остальным ──────────────────
      - name: Точка возврата
        if: inputs.action == 'backup' || inputs.action == 'deploy'
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" 'sudo /opt/helm/scripts/backup.sh'

      - name: Снять зависшую блокировку бэкапа
        if: inputs.action == 'backup-unlock'
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" '
            set -e
            # restic блокирует репозиторий на время работы. Если процесс
            # убили на середине — например, отменили запуск workflow —
            # блокировка остаётся и мешает ВСЕМ последующим бэкапам,
            # включая ночной. Поймано 30.08.2026 ровно так.
            #
            # Обычный unlock снимает только протухшие блокировки, то есть
            # оставшиеся от несуществующих процессов. --remove-all тут
            # намеренно НЕ используется: он снял бы и живую блокировку
            # идущего прямо сейчас бэкапа, и два процесса начали бы писать
            # в репозиторий одновременно.
            sudo env RESTIC_REPOSITORY=rclone:yandex:helm-backup \
                     RESTIC_PASSWORD_FILE=/etc/helm/secrets/restic_password \
                     restic unlock
            echo "=== блокировки после снятия ==="
            sudo env RESTIC_REPOSITORY=rclone:yandex:helm-backup \
                     RESTIC_PASSWORD_FILE=/etc/helm/secrets/restic_password \
                     restic list locks
          '

      # ── cleanup: мусор прошлых выкатов ───────────────────────────────
      - name: Убрать мусор прошлых выкатов
        if: inputs.action == 'cleanup'
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" '
            set -e
            echo "=== было ==="
            df -h / | tail -1
            sudo docker system df

            echo "=== образы без тега (остатки прошлых сборок) ==="
            # Только dangling. НЕ "docker system prune -a": тот снёс бы и
            # образы остановленных сервисов, а образ воркера с Docling —
            # около 6 ГБ, повторное скачивание стоит дороже занятого места.
            sudo docker image prune -f

            echo "=== кэш сборки ==="
            # Слои промежуточных сборок helm-core и воркера. Пересобираются
            # при следующем выкате, хранить между выкатами незачем.
            sudo docker builder prune -f

            echo "=== остановленные контейнеры ==="
            sudo docker container prune -f

            echo "=== временные файлы прошлых доставок ==="
            # Сюда scp кладёт код перед раскладкой. При обрыве выката они
            # остаются и в следующий раз мешают mv.
            rm -rf /tmp/helm_core /tmp/migrations /tmp/panel-dist \
                   /tmp/docker-compose.yml /tmp/Caddyfile \
                   /tmp/backup.sh /tmp/restore_test.sh /tmp/helm-control-init.py
            ls -la /tmp | head -20

            echo "=== стало ==="
            df -h / | tail -1
            sudo docker system df
          '

      # ── deploy: код, панель, конфигурация, пересборка ────────────────
      - uses: actions/setup-node@v4
        if: inputs.action == 'deploy'
        with:
          node-version: '20'

      - name: Сборка панели
        if: inputs.action == 'deploy'
        working-directory: helm/tree/panel
        run: |
          npm ci
          npm run build

      - name: Доставка файлов
        if: inputs.action == 'deploy'
        run: |
          cd helm/tree
          scp -i ~/.ssh/id_deploy -r control-plane/helm_core "$VPS_USER@$VPS_HOST:/tmp/helm_core"
          scp -i ~/.ssh/id_deploy -r control-plane/migrations "$VPS_USER@$VPS_HOST:/tmp/migrations"
          scp -i ~/.ssh/id_deploy -r panel/dist "$VPS_USER@$VPS_HOST:/tmp/panel-dist"
          scp -i ~/.ssh/id_deploy compose/docker-compose.yml "$VPS_USER@$VPS_HOST:/tmp/docker-compose.yml"
          scp -i ~/.ssh/id_deploy config/Caddyfile "$VPS_USER@$VPS_HOST:/tmp/Caddyfile"
          scp -i ~/.ssh/id_deploy scripts/backup.sh scripts/restore_test.sh "$VPS_USER@$VPS_HOST:/tmp/"
          scp -i ~/.ssh/id_deploy hermes/plugins/helm-control/__init__.py "$VPS_USER@$VPS_HOST:/tmp/helm-control-init.py"

      - name: Разложить и пересобрать
        if: inputs.action == 'deploy'
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" '
            set -e
            sudo rm -rf /opt/helm/control-plane/helm_core /opt/helm/control-plane/migrations
            sudo mv /tmp/helm_core /opt/helm/control-plane/helm_core
            sudo mv /tmp/migrations /opt/helm/control-plane/migrations
            sudo mv /tmp/docker-compose.yml /opt/helm/compose/docker-compose.yml
            sudo mv /tmp/Caddyfile /opt/helm/config/Caddyfile
            sudo mv /tmp/backup.sh /opt/helm/scripts/backup.sh
            sudo mv /tmp/restore_test.sh /opt/helm/scripts/restore_test.sh
            sudo chown -R root:root /opt/helm/control-plane/helm_core /opt/helm/control-plane/migrations \
              /opt/helm/compose/docker-compose.yml /opt/helm/config/Caddyfile \
              /opt/helm/scripts/backup.sh /opt/helm/scripts/restore_test.sh
            sudo chmod -R go-w /opt/helm/control-plane/helm_core /opt/helm/control-plane/migrations
            sudo chmod 755 /opt/helm/scripts/backup.sh /opt/helm/scripts/restore_test.sh

            # Содержимое каталога панели заменяется, сам каталог остаётся:
            # Caddy держит его примонтированным, и пересоздание каталога
            # рвёт монтирование (F-260829-10).
            sudo rm -rf /opt/helm/panel/dist/*
            sudo cp -r /tmp/panel-dist/. /opt/helm/panel/dist/
            sudo rm -rf /tmp/panel-dist
            sudo chown -R root:root /opt/helm/panel/dist

            cp /tmp/helm-control-init.py ~/.hermes/plugins/helm-control/__init__.py

            # Knowledge-бот заводит владелец в BotFather, агент токенов
            # не создаёт (устав §6, CLAUDE.md §5.4). Но compose монтирует
            # файл секрета bind-mount-ом и отказывается поднимать
            # контейнер, если файла нет вовсе, — на этом упал живой выкат
            # 30.08.2026: helm-core пересоздавался и не встал, потому что
            # у него в списке появились два ещё не заведённых секрета.
            #
            # Пустой файл 0600 — не токен. Код на пустом значении
            # отказывает: verify_webhook_secret() возвращает False при
            # пустом ожидаемом секрете, то есть вебхук Knowledge-бота
            # отвергает вообще всё, пока владелец не впишет настоящий
            # токен в этот же файл. Это ровно то поведение, которое нужно
            # для непровизионированного бота.
            #
            # Список именной: пустышки создаются только для этих двух
            # файлов. Делать так для всех секретов нельзя — пропавший
            # helm_database_url превратился бы из громкого падения в тихо
            # сломанный рантайм.
            for s in knowledge_telegram_bot_token knowledge_telegram_webhook_secret; do
              if [ ! -e /etc/helm/secrets/$s ]; then
                sudo install -m 600 -o root -g root /dev/null /etc/helm/secrets/$s
                echo "заведён пустой файл секрета $s: Knowledge-бот не настроен, его вебхук отвергает всё"
              fi
            done

            cd /opt/helm/compose
            sudo docker compose build helm-core helm-knowledge-worker

            # Обломки прерванного пересоздания. При --force-recreate
            # compose сначала переименовывает старый контейнер в
            # <id>_<имя>, потом создаёт новый, потом удаляет старый. Если
            # выкат умер между этими шагами (так и случилось 30.08.2026,
            # когда не встал helm-core), переименованный контейнер
            # остаётся навсегда и держит имя: следующий выкат падает с
            # "container name is already in use", уже не доходя даже до
            # сборки.
            #
            # Подстрока _helm-helm- встречается только в таком огрызке:
            # у обычного контейнера имя helm-helm-core-1, подчёркивания
            # перед ним нет.
            STALE=$(sudo docker ps -aq --filter name=_helm-helm-)
            if [ -n "$STALE" ]; then
              echo "обломки прошлого прерванного выката, удаляю:"
              sudo docker ps -a --filter name=_helm-helm-
              sudo docker rm -f $STALE
            fi

            sudo docker compose up -d --force-recreate helm-core helm-knowledge-worker
            sudo docker compose restart caddy
            sudo systemctl restart hermes-gateway
            sleep 20
            sudo docker compose ps helm-core helm-knowledge-worker caddy
            if [ -s /etc/helm/secrets/knowledge_telegram_bot_token ]; then
              echo "Knowledge-бот: токен на месте"
            else
              echo "Knowledge-бот: токена нет, бот не работает — задача владельца"
            fi
          '

      # ── migrate: отдельным шагом, после проверки ревизии ─────────────
      - name: Миграции
        # Проверка после наката отвечает на три вопроса, а не на один:
        #   1. под какой ролью в базу ходит само приложение. Если это
        #      helm (rolsuper=t, rolbypassrls=t) — RLS не действует
        #      вовсе, и вся изоляция держится только на коде;
        #   2. на всех ли tenant-таблицах включена и форсирована RLS и
        #      висит ровно одна политика: миграция могла лечь частично;
        #   3. не осталось ли строк без владельца НИ В ОДНОЙ таблице с
        #      колонкой knowledge_user_id, а не только в
        #      knowledge_sources, как проверялось раньше.
        #
        # Сама проверка идёт под ролью helm намеренно: обычная роль под
        # FORCE ROW LEVEL SECURITY без выставленного GUC не видит ни
        # одной строки, и «сирот нет» вышло бы ложно-положительным.
        #
        # SQL передаётся heredoc-ом с экранированным ограничителем
        # (<<\SQL): иначе bash сервера развернёт доллары раньше, чем
        # строка дойдёт до psql — на этом падали два живых запуска.
        # Одинарных кавычек в SQL нет вовсе, вся команда завёрнута в
        # одинарные кавычки для ssh; вместо них долларовые кавычки
        # Postgres.
        if: inputs.action == 'migrate'
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" '
            set -e
            cd /opt/helm/compose
            echo "=== было ==="
            sudo docker compose exec -T helm-core python3 -m alembic current
            sudo docker compose exec -T helm-core python3 -m alembic upgrade head
            echo "=== стало ==="
            sudo docker compose exec -T helm-core python3 -m alembic current
            sudo docker exec -i helm-postgres-1 psql -U helm -d helm <<\SQL
            \echo === под какой ролью приложение ходит в базу ===
            select usename, count(*) as connections
            from pg_stat_activity where datname = current_database()
            group by 1 order by 1;

            \echo === права ролей: суперпользователь и обход RLS ===
            select rolname, rolsuper, rolbypassrls
            from pg_roles where rolcanlogin order by rolname;

            \echo === RLS по таблицам: включена, форсирована, политик ===
            select c.relname, c.relrowsecurity as rls,
                   c.relforcerowsecurity as forced, count(p.polname) as policies
            from pg_class c left join pg_policy p on p.polrelid = c.oid
            where c.relrowsecurity group by 1,2,3 order by 1;

            \echo === пользователи знания ===
            select role, status, count(*) from knowledge_users
            group by 1,2 order by 1,2;

            \echo === строки без владельца по каждой таблице (ожидается 0) ===
            do $chk$
            declare t record; n bigint;
            begin
              for t in select table_name from information_schema.columns
                       where column_name = $q$knowledge_user_id$q$
                         and table_schema = $q$public$q$
                       order by table_name
              loop
                execute format($f$select count(*) from %I
                                  where knowledge_user_id is null$f$,
                               t.table_name) into n;
                raise notice $m$%: %$m$, rpad(t.table_name, 34), n;
              end loop;
            end
            $chk$;
          SQL
          '

      - name: Проверка восстановления
        if: inputs.action == 'restore-test'
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            'sudo /opt/helm/scripts/backup.sh && sudo /opt/helm/scripts/restore_test.sh'

      - name: Откат схемы
        if: inputs.action == 'rollback'
        run: |
          if [ -z "${{ inputs.revision }}" ]; then
            echo "::error::Для отката нужно указать ревизию"
            exit 1
          fi
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" "
            cd /opt/helm/compose
            sudo docker compose exec -T helm-core python3 -m alembic downgrade ${{ inputs.revision }}
            sudo docker compose exec -T helm-core python3 -m alembic current
          "

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/id_deploy

      - name: Сообщить в Telegram
        # Проверка секрета — внутри шага, а не в `if`: контекст secrets в
        # условиях шагов недоступен, и такое условие молча ломает workflow.
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram-уведомление пропущено: секреты не заведены"
            exit 0
          fi
          STATUS='${{ job.status }}'
          curl -sS -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT_ID" \
            -d "text=Выкат «${{ inputs.action }}»: $STATUS. Логи: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || true
