name: Выкат на сервер

# Единственный способ, которым агент может работать на живом сервере, не
# получая приватного ключа: ключ лежит в GitHub Secrets, агент запускает
# workflow и читает логи, но самого ключа не видит никогда (устав §6,
# CLAUDE.md §5.4 — «секреты живут только в GitHub Secrets»).
#
# Секреты, которые нужно завести один раз:
#   VPS_SSH_KEY      приватный ключ ОТДЕЛЬНОЙ пары для CI (не тот, что на
#                    машине владельца — чтобы отзывался независимо)
#   VPS_KNOWN_HOSTS  вывод `ssh-keyscan -H 185.250.44.137`; без него
#                    пришлось бы отключить проверку хоста, а это ровно та
#                    дыра, ради которой существует known_hosts
#
# По умолчанию действие — `verify`, то есть только чтение. Выкатить
# что-либо можно лишь явно выбрав действие: случайный запуск ничего не
# меняет.
#
# ── Политика выката (решение владельца 02.09.2026) ───────────────────
#
# Две страховки с разными задачами, и путать их нельзя:
#
#   ЛОКАЛЬНАЯ точка возврата (scripts/local-rescue-checkpoint.sh)
#     защищает от ОШИБКИ ВЫКАТА. Снимается на самом VPS за десятки
#     секунд, ни от какого стороннего сервиса не зависит.
#     ОБЯЗАТЕЛЬНА перед каждым `deploy`; не снялась — выката нет.
#
#   OFFSITE restic (scripts/backup.sh)
#     защищает от ПОТЕРИ МАШИНЫ. Зависит от стороннего хранилища,
#     которое 02.09.2026 трижды подряд отдало 500, съев по двадцать
#     минут. Из критического пути `deploy` ВЫНЕСЕН: запускается
#     отдельным `action=backup` и ночным cron.
#     ОБЯЗАТЕЛЕН перед любым необратимым действием.
#
# Соответственно два класса действий:
#
#   SAFE/аддитивное (`deploy`, `migrate`) — добавляет и меняет код,
#     ничего не удаляет безвозвратно. Гейт: локальная точка возврата.
#
#   НЕОБРАТИМОЕ (`destructive`, `rollback`) — удаление данных, purge
#     файлов, downgrade схемы. Гейт закрыт по умолчанию: нужен свежий
#     успешный offsite-бэкап И пройденный тест восстановления, либо
#     подтверждённый владельцем снапшот провайдера в `provider_snapshot`.
#     Локальной точки возврата здесь НЕДОСТАТОЧНО: она лежит на том же
#     диске, что и данные, которые удаляются.
#
# `recon` — read-only по контракту. Скрипты с именем `destructive-*.sh`
# он выполнять отказывается, для них есть `destructive` с гейтом.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Что сделать'
        required: true
        default: verify
        type: choice
        options:
          - keyscan       # напечатать ключи сервера для VPS_KNOWN_HOSTS
          - verify        # только посмотреть состояние, ничего не менять
          - backup        # offsite: зашифрованный restic в удалённое хранилище
          - seed          # offsite: первичное заполнение маленькими порциями
          - checkpoint    # локальная точка возврата на самом VPS
          - deploy        # SAFE: код + панель + пересборка (только аддитивное)
          - migrate       # alembic upgrade head (после deploy)
          - recon         # разовая read-only разведка (см. script)
          - destructive   # необратимое действие через гейт (см. script)
          - restore-test  # backup.sh + restore_test.sh
          - rollback      # alembic downgrade до указанной ревизии
      revision:
        description: 'Ревизия для rollback (например 03af17f40250)'
        required: false
        default: ''
      script:
        description: 'Имя файла в scripts/ для action=recon или action=destructive'
        required: false
        default: ''
      provider_snapshot:
        description: 'Подтверждённый снапшот VPS/провайдера (id или дата) — единственная замена offsite-бэкапу для необратимых действий'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Отдельная от `rhythm` группа: ночной цикл и выкат не должны стоять в
  # одной очереди, но два выката одновременно — недопустимы.
  #
  # Группа зависит от действия: `recon` (read-only разведка, ничего не
  # меняет на сервере) не обязан ждать 20-минутный выкат в очереди, а
  # два выката по-прежнему сериализованы между собой. Найдено 02.09.2026:
  # диагностический прогон простоял всю точку возврата чужого деплоя, и
  # цикл "правка → факт" вырос с минуты до получаса на пустом месте.
  group: deploy-${{ inputs.action }}
  cancel-in-progress: false

env:
  VPS_HOST: 185.250.44.137
  VPS_USER: helm

jobs:
  run:
    runs-on: ubuntu-latest
    # НАЙДЕНО живыми прогонами R4 (#187, run 196): канонический golden
    # benchmark на 3 кандидатах (keepalive-проба + 21 кейс × 3 повтора на
    # каждого, qwen2.5:7b на CPU заметно медленнее) реально не укладывается
    # в 60 минут — не зависает, а именно столько занимает честная работа.
    # Прежний лимит обрывал recon ПОСЕРЕДИНЕ прогона (владелец сам это
    # предвидел: "жди, перепроверяй, это нормально"), а не защищал от
    # чего-то настоящего: обычный action=deploy занимает 2-3 минуты, этот
    # запас его не касается.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # keyscan работает БЕЗ секретов: это первый шаг настройки, когда
      # VPS_KNOWN_HOSTS ещё неоткуда взять. Нужен потому, что ssh-keyscan
      # на Windows у владельца старый и не договаривается с OpenSSH 9.6
      # на сервере; здесь свежий.
      - name: Ключи сервера для VPS_KNOWN_HOSTS
        if: inputs.action == 'keyscan'
        run: |
          echo "Скопируйте строки ниже целиком в секрет VPS_KNOWN_HOSTS:"
          echo "---"
          ssh-keyscan "$VPS_HOST"
          echo "---"

      - name: Ключ доступа
        if: inputs.action != 'keyscan'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::Не заведены секреты VPS_SSH_KEY и/или VPS_KNOWN_HOSTS"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # ── verify: только чтение ────────────────────────────────────────
      - name: Состояние сервера
        if: inputs.action == 'verify'
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" '
            set -e
            echo "=== контейнеры ==="
            cd /opt/helm/compose && sudo docker compose ps
            echo "=== ревизия схемы ==="
            sudo docker compose exec -T helm-core python3 -m alembic current
            echo "=== роль базы: суперпользователь? (ожидается f) ==="
            sudo docker exec helm-postgres-1 psql -U helm -d helm -tAc \
              "select rolname, rolsuper from pg_roles where rolname in ('"'"'helm'"'"','"'"'helm_app'"'"')"
            echo "=== объём знаний ==="
            sudo docker exec helm-postgres-1 psql -U helm -d helm -tAc \
              "select count(*) as sources from knowledge_sources" || echo "таблиц ещё нет"
            echo "=== место и память ==="
            df -h / | tail -1; free -h | head -2
            echo "=== последний бэкап ==="
            stat -c %y /var/lib/helm-guardian/last-backup 2>/dev/null || echo "нет отметки"
          '

      # ── страховки: локальная точка возврата и offsite-бэкап ─────────
      # Доставляем актуальные скрипты ДО того, как они понадобятся — не
      # общим шагом "Доставка файлов"/"Разложить и пересобрать" (тот идёт
      # ПОСЛЕ точки возврата и пересобирает helm-core, чего до точки
      # возврата быть не должно), а отдельным лёгким scp, который не
      # трогает работающие контейнеры.
      - name: Доставить скрипты страховок
        if: contains(fromJSON('["backup","seed","checkpoint","deploy","migrate","restore-test","destructive","rollback"]'), inputs.action)
        run: |
          scp -i ~/.ssh/id_deploy \
            helm/tree/scripts/backup.sh \
            helm/tree/scripts/restore_test.sh \
            helm/tree/scripts/local-rescue-checkpoint.sh \
            helm/tree/scripts/backup-seed.sh \
            helm/tree/scripts/setup-health-role.sh \
            "$VPS_USER@$VPS_HOST:/tmp/"
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" '
            set -e
            for f in backup.sh restore_test.sh local-rescue-checkpoint.sh backup-seed.sh \
                     setup-health-role.sh; do
              sudo mv "/tmp/$f" "/opt/helm/scripts/$f"
              sudo chown root:root "/opt/helm/scripts/$f"
              sudo chmod 755 "/opt/helm/scripts/$f"
            done
          '

      - name: Локальная точка возврата
        if: inputs.action == 'deploy' || inputs.action == 'migrate' || inputs.action == 'checkpoint'
        # Гейт SAFE-выката, fail-closed: шаг упал — дальше не едет ничего.
        # Снимается на самом VPS (pg_dumpall с ролями, /opt/helm-knowledge,
        # /opt/helm-knowledge-private, конфигурация, манифест + SHA256),
        # проверяет себя сразу после записи и не зависит ни от одного
        # стороннего сервиса. Защищает от ошибки выката — не от потери
        # машины: она лежит на том же диске.
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=12 \
            -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            'sudo /opt/helm/scripts/local-rescue-checkpoint.sh create'

      - name: Offsite-бэкап
        if: inputs.action == 'backup'
        # ВЫНЕСЕН ИЗ ПУТИ ВЫКАТА 02.09.2026 (решение владельца). Здесь
        # только явный action=backup и ночной cron; deploy на него больше
        # не завязан и не падает из-за чужого хранилища.
        #
        # НАЙДЕНО 01.09.2026: backup.sh молчит в stdout, пока restic
        # читает/чанкует/заливает через rclone на Яндекс Диск — за это
        # время через SSH-соединение нет никакого трафика. Первая попытка
        # оборвалась через ~4.5 минуты "Broken pipe" — idle-таймаут
        # NAT/файрвола на пути раннер→сервер (типичные 300 секунд
        # совпадают), не зависание restic. ServerAlive* держит TCP живым
        # на уровне SSH, пока удалённая команда молчит.
        #
        # НАЙДЕНО 02.09.2026: после этого фикса три прогона подряд по
        # ~20 минут упёрлись уже в сам webdav.yandex.ru — 500 и таймауты
        # на отдельных чанках, "Fatal: unable to save snapshot". Хранилище
        # нестабильно, и это открытый вопрос H-260902-01, а не то, что
        # обходится continue-on-error.
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=12 \
            -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" 'sudo /opt/helm/scripts/backup.sh'

      - name: Заполнение offsite порциями
        if: inputs.action == 'seed'
        # Первая заливка по ненадёжному каналу: не одна большая выгрузка,
        # а несколько маленьких. Каждая успешная порция навсегда
        # закрепляется в репозитории, повторный запуск продолжает с того
        # места, где остановился. Собственный бюджет по времени внутри
        # скрипта — чтобы прогон не обрывался таймаутом раннера на
        # полуслове: недоделанное честно, оборванное непонятно.
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=12 \
            -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            'sudo /opt/helm/scripts/backup-seed.sh'

      # ── deploy: код, панель, конфигурация, пересборка ────────────────
      - uses: actions/setup-node@v4
        if: inputs.action == 'deploy'
        with:
          node-version: '20'

      - name: Сборка панели
        if: inputs.action == 'deploy'
        working-directory: helm/tree/panel
        run: |
          npm ci
          npm run build

      - name: Доставка файлов
        # НАЙДЕНО 31.08.2026 (F-260831-07): семь последовательных `scp -r`
        # зависали на живом сервере пять раз подряд (~8+ минут без
        # прогресса) — диск/память сервера в порядке (проверено дважды),
        # лёгкие ssh-команды (verify/recon) отрабатывают за секунды.
        # Суммарный объём передаваемого — единицы мегабайт (helm_core +
        # migrations + panel/dist), полное зависание на такой мелочи не
        # похоже на throttling по скорости — больше похоже на известный
        # класс багов OpenSSH 9.x: `scp -r` по умолчанию идёт через SFTP-
        # подсистему, а не старый SCP-протокол, и есть задокументированные
        # зависания именно на рекурсивной передаче дерева из многих
        # мелких файлов (helm_core — десятки .py). Одна tar-архивация +
        # один поток через `ssh exec` вообще не использует SFTP-подсистему.
        if: inputs.action == 'deploy'
        run: |
          cd helm/tree
          stage=$(mktemp -d)
          cp -r control-plane/helm_core "$stage/helm_core"
          cp -r control-plane/migrations "$stage/migrations"
          cp -r panel/dist "$stage/panel-dist"
          cp compose/docker-compose.yml "$stage/docker-compose.yml"
          cp config/Caddyfile "$stage/Caddyfile"
          cp scripts/backup.sh scripts/restore_test.sh "$stage/"
          cp hermes/plugins/helm-control/__init__.py "$stage/helm-control-init.py"
          tar -czf - -C "$stage" \
              helm_core migrations panel-dist docker-compose.yml Caddyfile \
              backup.sh restore_test.sh helm-control-init.py \
            | ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" 'tar -xzf - -C /tmp'
          rm -rf "$stage"

      - name: Разложить и пересобрать
        if: inputs.action == 'deploy'
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" '
            set -e
            sudo rm -rf /opt/helm/control-plane/helm_core /opt/helm/control-plane/migrations
            sudo mv /tmp/helm_core /opt/helm/control-plane/helm_core
            sudo mv /tmp/migrations /opt/helm/control-plane/migrations
            sudo mv /tmp/docker-compose.yml /opt/helm/compose/docker-compose.yml
            sudo mv /tmp/Caddyfile /opt/helm/config/Caddyfile
            sudo mv /tmp/backup.sh /opt/helm/scripts/backup.sh
            sudo mv /tmp/restore_test.sh /opt/helm/scripts/restore_test.sh
            sudo chown -R root:root /opt/helm/control-plane/helm_core /opt/helm/control-plane/migrations \
              /opt/helm/compose/docker-compose.yml /opt/helm/config/Caddyfile \
              /opt/helm/scripts/backup.sh /opt/helm/scripts/restore_test.sh
            sudo chmod -R go-w /opt/helm/control-plane/helm_core /opt/helm/control-plane/migrations
            sudo chmod 755 /opt/helm/scripts/backup.sh /opt/helm/scripts/restore_test.sh

            # Содержимое каталога панели заменяется, сам каталог остаётся:
            # Caddy держит его примонтированным, и пересоздание каталога
            # рвёт монтирование (F-260829-10).
            sudo rm -rf /opt/helm/panel/dist/*
            sudo cp -r /tmp/panel-dist/. /opt/helm/panel/dist/
            sudo rm -rf /tmp/panel-dist
            sudo chown -R root:root /opt/helm/panel/dist

            cp /tmp/helm-control-init.py ~/.hermes/plugins/helm-control/__init__.py

            cd /opt/helm/compose
            sudo docker compose build helm-core helm-knowledge-worker
            sudo docker compose up -d --force-recreate helm-core helm-knowledge-worker
            # §14.12 Z2 (gemma2:2b, живой замер 31.08.2026,
            # docs/KNOWLEDGE_MODELS.md) — не пересоздаётся при каждом
            # деплое (та же логика, что уже у helm-embed: model-сервис,
            # не код этого репозитория), но обязан БЫТЬ ПОДНЯТ и нести
            # выбранную модель — идемпотентно на каждый normal deploy,
            # не только на первый.
            sudo docker compose up -d ollama
            sudo docker compose exec -T ollama ollama pull gemma2:2b
            sudo docker compose restart caddy
            sudo systemctl restart hermes-gateway
            sleep 20
            sudo docker compose ps helm-core helm-knowledge-worker ollama caddy
          '

      - name: Отметить выкаченную ревизию
        # v4.0 §14.22 требует знать ТОЧНЫЙ выкаченный SHA, а не считать,
        # что он равен HEAD ветки. Файлы раскладываются как файлы, git на
        # сервере нет — без этой отметки ревизию приходится восстанавливать
        # по отпечатку содержимого (scripts/r0-match-deployed-sha.sh).
        # Пишется ПОСЛЕ успешной пересборки: отметка означает "это работает
        # сейчас", а не "это пытались выкатить".
        if: inputs.action == 'deploy'
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            "echo '${{ github.sha }}' | sudo tee /opt/helm/DEPLOYED_SHA >/dev/null"

      # ── migrate: отдельным шагом, после проверки ревизии ─────────────
      - name: Миграции
        if: inputs.action == 'migrate'
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" '
            set -e
            cd /opt/helm/compose
            echo "=== было ==="
            sudo docker compose exec -T helm-core python3 -m alembic current
            sudo docker compose exec -T helm-core python3 -m alembic upgrade head
            echo "=== стало ==="
            sudo docker compose exec -T helm-core python3 -m alembic current
            echo "=== записей без владельца (ожидается 0) ==="
            sudo docker exec helm-postgres-1 psql -U helm -d helm -tAc \
              "select count(*) from knowledge_sources where knowledge_user_id is null"
          '

      - name: Схема health
        # Схемой `health` alembic не управляет и управлять не может:
        # `helm_app`, которым он подключается, не имеет CREATE на эту
        # схему, а её таблицы обязан создавать `helm_health` — иначе
        # владелец объекта обходит любой REVOKE (см. докстринг
        # `models/health_tables.py` и сам скрипт).
        #
        # Поэтому «привести схему в соответствие с кодом» — это ДВА шага,
        # и второй до 02.09.2026 не был автоматизирован вовсе: новые
        # health-таблицы появлялись только если кто-то помнил прогнать
        # скрипт руками. Скрипт идемпотентен (`CREATE TABLE IF NOT
        # EXISTS`, пароль не пересоздаётся) и fail-closed на проверке
        # «helm_app не читает health».
        if: inputs.action == 'migrate'
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            'sudo /opt/helm/scripts/setup-health-role.sh'

      # ── recon: разовая read-only/функциональная разведка ─────────────
      - name: Разведка
        # Скрипты живут в scripts/*.sh — каждая волна разведки своим
        # файлом, ничего не перезаписывает предыдущую. Доставляется и
        # выполняется в один шаг, ничего не оставляя на сервере: сам файл
        # решает, что проверять, этот шаг только доставка + запуск.
        if: inputs.action == 'recon'
        run: |
          if [ -z "${{ inputs.script }}" ]; then
            echo "::error::Для recon нужно указать script (имя файла в scripts/)"
            exit 1
          fi
          case "${{ inputs.script }}" in
            destructive-*)
              echo "::error::${{ inputs.script }} — необратимый скрипт. recon read-only по контракту; запускайте через action=destructive, он проходит гейт."
              exit 1
              ;;
          esac
          scp -i ~/.ssh/id_deploy "helm/tree/scripts/${{ inputs.script }}" \
              "$VPS_USER@$VPS_HOST:/tmp/recon.sh"
          # НАЙДЕНО живым прогоном R4 02.09.2026: recon-скрипт, несколько
          # минут пишущий вывод ТОЛЬКО в файл на сервере (например,
          # замер latency в цикле), не даёт SSH-сессии ни байта трафика
          # — соединение рвётся как «простаивающее» (client_loop: send
          # disconnect: Broken pipe), хотя сама работа идёт. Тот же
          # keepalive, что уже стоит у шага «Локальная точка возврата».
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=12 \
              -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" '
            bash /tmp/recon.sh
            rc=$?
            rm -f /tmp/recon.sh
            exit $rc
          '

      # ── необратимое: гейт закрыт по умолчанию ───────────────────────
      - name: Гейт необратимого действия
        if: inputs.action == 'destructive' || inputs.action == 'rollback'
        # Fail closed. Локальной точки возврата здесь НЕДОСТАТОЧНО: она
        # лежит на том же диске, что и данные, которые удаляются. Нужен
        # либо свежий offsite-бэкап С пройденным тестом восстановления
        # (§26.3: бэкап без свежего restore-теста здоровым не считается),
        # либо подтверждённый владельцем снапшот провайдера.
        env:
          PROVIDER_SNAPSHOT: ${{ inputs.provider_snapshot }}
        run: |
          if [ -n "$PROVIDER_SNAPSHOT" ]; then
            echo "Гейт открыт снапшотом провайдера: $PROVIDER_SNAPSHOT (подтверждён владельцем при запуске)"
            exit 0
          fi
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" '
            set -e
            fresh() {
              # $1 — файл-отметка, $2 — предельный возраст в часах.
              # sudo обязателен: /var/lib/helm-guardian роли helm не
              # читается, и без него гейт закрыт всегда — в том числе при
              # честном свежем бэкапе (найдено 02.09.2026 прогоном 138).
              sudo test -f "$1" || { echo "нет отметки $1"; return 1; }
              age=$(( ( $(date +%s) - $(sudo stat -c %Y "$1") ) / 3600 ))
              echo "$1: $age ч назад (предел $2 ч)"
              [ "$age" -le "$2" ]
            }
            ok=1
            # Сутки, а не двое: бэкап ежедневный, и «вчерашний успех при
            # сегодняшнем провале» — ровно то состояние, в котором
            # необратимое действие делать нельзя. Restore-тест
            # еженедельный (§26.4), отсюда 168 часов.
            fresh /var/lib/helm-guardian/last-backup 24 || ok=0
            fresh /var/lib/helm-guardian/last-restore-test 168 || ok=0
            [ "$ok" = 1 ]
          ' || {
            echo "::error::Гейт закрыт: нет свежего offsite-бэкапа с пройденным тестом восстановления. Запустите action=backup, затем action=restore-test — либо укажите provider_snapshot, если снапшот VPS снят и проверен вручную."
            exit 1
          }

      - name: Необратимое действие
        if: inputs.action == 'destructive'
        run: |
          if [ -z "${{ inputs.script }}" ]; then
            echo "::error::Для destructive нужно указать script (имя файла в scripts/)"
            exit 1
          fi
          scp -i ~/.ssh/id_deploy "helm/tree/scripts/${{ inputs.script }}" \
              "$VPS_USER@$VPS_HOST:/tmp/destructive.sh"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=12 \
            -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" '
            bash /tmp/destructive.sh
            rc=$?
            rm -f /tmp/destructive.sh
            exit $rc
          '

      - name: Проверка восстановления
        if: inputs.action == 'restore-test'
        # Тот же keepalive, что у "Offsite-бэкап" — тут тоже сначала
        # молча отрабатывает backup.sh.
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=12 \
            -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            'sudo /opt/helm/scripts/backup.sh && sudo /opt/helm/scripts/restore_test.sh'

      - name: Откат схемы
        if: inputs.action == 'rollback'
        run: |
          if [ -z "${{ inputs.revision }}" ]; then
            echo "::error::Для отката нужно указать ревизию"
            exit 1
          fi
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" "
            cd /opt/helm/compose
            sudo docker compose exec -T helm-core python3 -m alembic downgrade ${{ inputs.revision }}
            sudo docker compose exec -T helm-core python3 -m alembic current
          "

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/id_deploy

      - name: Сообщить в Telegram
        # Проверка секрета — внутри шага, а не в `if`: контекст secrets в
        # условиях шагов недоступен, и такое условие молча ломает workflow.
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram-уведомление пропущено: секреты не заведены"
            exit 0
          fi
          STATUS='${{ job.status }}'
          curl -sS -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT_ID" \
            -d "text=Выкат «${{ inputs.action }}»: $STATUS. Логи: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || true
