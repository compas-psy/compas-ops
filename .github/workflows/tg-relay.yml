name: Доставка в Telegram

# Мост в Telegram для агентских циклов.
#
# Зачем он существует. Песочница, в которой идут ночной цикл и борд, может не
# иметь выхода в интернет: в облачных средах Claude сеть ограничена списком
# доменов, и api.telegram.org в него по умолчанию не входит. Тогда агент
# коммитит артефакты в репозиторий и запускает этот воркфлоу — у раннера
# GitHub интернет открыт, и отправляет он.
#
# Если среде агента разрешён api.telegram.org, воркфлоу не нужен: агент
# вызывает tools/deliver.py сам. Подробности — в charter/09_COWORK.md.
#
# Секреты (Settings → Secrets and variables → Actions → New repository secret):
#   TG_BOT_TOKEN — токен бота из @BotFather
#   TG_CHAT_ID   — chat_id учредителя; узнать — воркфлоу «Telegram: диагностика»
#
# Два способа запуска:
#   1. Actions → «Доставка в Telegram» → Run workflow: указать ветку и пути.
#   2. Пуш в main файлов в outbox/ — уходят автоматически.

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Путь к файлу с текстом сообщения (например outbox/2026-08-14_daily.txt)'
        required: false
        default: ''
      deck:
        description: 'Путь к исходнику дека .md — будет собран в PDF и отправлен презентацией'
        required: false
        default: ''
      with_html:
        description: 'Дослать HTML-версию дека'
        type: boolean
        required: false
        default: false
      message:
        description: 'Или просто текст — для проверки связи, если пути не указаны'
        required: false
        default: 'Проверка связи. Если вы это читаете, канал доставки работает.'
  push:
    branches: [main]
    paths:
      - 'outbox/**'

# Две доставки разом могут перемешать сообщения в ленте: очередь, без отмены
# уже идущей отправки.
concurrency:
  group: tg-delivery
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    # Страховка от зависшего браузера: доставка либо укладывается в эти минуты,
    # либо это поломка, которую надо чинить, а не ждать.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Проверить секреты
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          missing=""
          [ -z "$TG_BOT_TOKEN" ] && missing="$missing TG_BOT_TOKEN"
          [ -z "$TG_CHAT_ID" ] && missing="$missing TG_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing. Settings → Secrets and variables → Actions → New repository secret. Как получить chat_id — воркфлоу «Telegram: диагностика»."
            exit 1
          fi
          echo "Секреты на месте."

      - name: Поставить Chromium для сборки PDF
        # Именно Chromium, а не предустановленный google-chrome: тот на раннере
        # запускается, но PDF не печатает и молча висит до таймаута. Ставим
        # сборку Playwright — ту же, что работает в средах агентов.
        run: |
          set -euo pipefail
          if command -v chromium >/dev/null || command -v chromium-browser >/dev/null; then
            echo "Chromium уже есть."
            exit 0
          fi
          if ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome >/dev/null 2>&1; then
            echo "Chromium от Playwright уже установлен."
            exit 0
          fi
          python3 -m pip install --quiet --disable-pip-version-check playwright
          python3 -m playwright install chromium
          ls ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome

      - name: Доставить по указанным путям
        if: github.event_name == 'workflow_dispatch' && (inputs.text != '' || inputs.deck != '')
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEXT_PATH: ${{ inputs.text }}
          DECK_PATH: ${{ inputs.deck }}
          WITH_HTML: ${{ inputs.with_html }}
        run: |
          set -euo pipefail
          args=""
          if [ -n "$TEXT_PATH" ]; then
            [ -f "$TEXT_PATH" ] || { echo "::error::Файл текста не найден: $TEXT_PATH"; exit 1; }
            args="$args --text $TEXT_PATH"
          fi
          if [ -n "$DECK_PATH" ]; then
            [ -f "$DECK_PATH" ] || { echo "::error::Исходник дека не найден: $DECK_PATH"; exit 1; }
            args="$args --deck $DECK_PATH"
          fi
          [ "$WITH_HTML" = "true" ] && args="$args --with-html"

          if [ -z "$TEXT_PATH" ]; then
            # Дек без сопроводительного текста: deliver.py требует текст, поэтому
            # собираем минимальный — вложение без единой строки читается как мусор.
            echo "<b>Дек по запросу</b>" > /tmp/deck_note.html
            args="--text /tmp/deck_note.html $args"
          fi

          python3 tools/deliver.py $args

      - name: Отправить проверочное сообщение
        if: github.event_name == 'workflow_dispatch' && inputs.text == '' && inputs.deck == ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          printf '%s' "$MESSAGE" > /tmp/message.txt
          python3 tools/tg_send.py text --from-file /tmp/message.txt --no-preview

      - name: Отправить новые файлы из outbox
        if: github.event_name == 'push'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Первый пуш в ветку приходит с нулевым before — сравнивать не с чем,
          # берём файлы последнего коммита.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git show --name-only --diff-filter=AM --pretty=format: "$AFTER" -- outbox/ | sed '/^$/d')
          else
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- outbox/ || true)
          fi
          if [ -z "$FILES" ]; then echo "Нечего отправлять."; exit 0; fi

          # Порядок фиксированный: сначала весь текст, потом вложения. Иначе в
          # ленте учредителя дек приходит раньше объяснения, зачем его открывать.
          echo "$FILES" | grep -E '\.deck\.md$' > /tmp/decks.txt || true
          echo "$FILES" | grep -Ev '\.deck\.md$' | grep -E '\.(txt|md)$' > /tmp/texts.txt || true
          echo "$FILES" | grep -Ev '\.deck\.md$|\.(txt|md)$' > /tmp/files.txt || true

          while read -r f; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            echo "текстом: $f"
            # README и служебные заметки не рассылаем.
            case "$(basename "$f")" in README.md) echo "  пропуск"; continue;; esac
            python3 tools/tg_send.py text --from-file "$f" --no-preview
          done < /tmp/texts.txt

          while read -r f; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            echo "презентацией: $f"
            printf '<b>Дек из outbox</b>\n%s' "$(basename "$f")" > /tmp/deck_note.html
            python3 tools/deliver.py --text /tmp/deck_note.html --deck "$f"
          done < /tmp/decks.txt

          while read -r f; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            echo "файлом: $f"
            python3 tools/tg_send.py file "$f" --caption "$(basename "$f")"
          done < /tmp/files.txt
