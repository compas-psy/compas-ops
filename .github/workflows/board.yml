name: Борд C-1

# Понедельник и четверг 07:00 UTC = 10:00 МСК. Запуск вручную — кнопкой или пушем в .runner/board.
# Секреты: CLAUDE_CODE_OAUTH_TOKEN, TG_BOT_TOKEN, TG_CHAT_ID.
on:
  schedule:
    - cron: '0 7 * * 1,4'
  workflow_dispatch:
  push:
    paths:
      - '.runner/board'

permissions:
  contents: write

concurrency:
  group: rhythm
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Браузер для сборки PDF
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Репозитории продуктов
        env:
          PRODUCTS_READ_TOKEN: ${{ secrets.PRODUCTS_READ_TOKEN }}
        run: |
          mkdir -p products
          git clone -q --depth 20 https://github.com/compas-psy/zapiski.git products/zapiski || echo "zapiski не склонировался"
          if [ -n "$PRODUCTS_READ_TOKEN" ]; then
            for r in cmpas.ru compas-voice; do
              git clone -q --depth 20 "https://x-access-token:${PRODUCTS_READ_TOKEN}@github.com/compas-psy/$r" "products/$r" || echo "$r не склонировался"
            done
          else
            echo "PRODUCTS_READ_TOKEN не задан — ПРАКТИКА и МОМЕНТЫ работают вслепую"
          fi
          ls -1 products/ | sed 's/^/склонирован: /'

      - name: Claude Code и конвертер документов
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          pip install --quiet 'markitdown[all]' || echo "markitdown не установился, продолжаем без него"

      - name: Заседание борда
        id: cycle
        continue-on-error: true
        env:
          DBUS_SESSION_BUS_ADDRESS: /dev/null
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          claude -p "$(cat .runner/prompt-board.md)" \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Task,TodoWrite,WebFetch" \
            --permission-mode acceptEdits \
            2>&1 | tee /tmp/cycle.log

      - name: Сохранить лог и зафиксировать результат
        if: always()
        run: |
          mkdir -p log/runner
          day=$(date -u +%Y-%m-%d)
          {
            echo "# Прогон борда $day"
            echo "статус шага агента: ${{ steps.cycle.outcome }}"
            echo "run id: ${{ github.run_id }}"
            echo
            tail -c 60000 /tmp/cycle.log 2>/dev/null || echo "лог пуст — агент не стартовал"
          } > "log/runner/${day}_board.log"
          git config user.name  "simpas-board"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "изменений нет, коммит не нужен"
          else
            git commit -m "Борд C-1 ${day}"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Проверить результат
        run: |
          day=$(date -u +%Y-%m-%d)
          if [ "${{ steps.cycle.outcome }}" != "success" ]; then
            echo "::error::Агент борда завершился с ошибкой — разбор в log/runner/${day}_board.log"
            exit 1
          fi
          if [ ! -f "outbox/${day}_board.txt" ]; then
            echo "::error::Нет outbox/${day}_board.txt — борд прошёл, но сообщение учредителю не написано"
            exit 1
          fi
          echo "Сообщение борда на месте: outbox/${day}_board.txt"
